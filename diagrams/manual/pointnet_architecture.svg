<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #16324f; }
      .subtitle { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #4b647d; }
      .box-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #16324f; }
      .box-text { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #2e475f; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #506b85; }
      .legend { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #16324f; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#58728d" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc" />

  <text x="70" y="70" class="title">PointNet: схема архитектуры для семантической сегментации</text>
  <text x="70" y="105" class="subtitle">Блок-схема высокого уровня: выравнивание, извлечение признаков, глобальная агрегация и покомпонентная классификация</text>

  <rect x="70" y="150" width="220" height="100" rx="22" fill="#dcecff" stroke="#8fb6e8" stroke-width="2"/>
  <text x="180" y="190" text-anchor="middle" class="box-title">Входное облако</text>
  <text x="180" y="217" text-anchor="middle" class="box-text">N × F признаков</text>
  <text x="180" y="240" text-anchor="middle" class="small">XYZ, RGB, Intensity, Returns</text>

  <rect x="350" y="150" width="220" height="100" rx="22" fill="#dcecff" stroke="#8fb6e8" stroke-width="2"/>
  <text x="460" y="190" text-anchor="middle" class="box-title">T-Net (3×3)</text>
  <text x="460" y="217" text-anchor="middle" class="box-text">Выравнивание</text>
  <text x="460" y="240" text-anchor="middle" class="small">геометрии по координатам</text>

  <rect x="630" y="150" width="220" height="100" rx="22" fill="#dcecff" stroke="#8fb6e8" stroke-width="2"/>
  <text x="740" y="190" text-anchor="middle" class="box-title">MLP</text>
  <text x="740" y="217" text-anchor="middle" class="box-text">64 → 64</text>
  <text x="740" y="240" text-anchor="middle" class="small">Локальные признаки</text>

  <rect x="910" y="150" width="220" height="100" rx="22" fill="#dcecff" stroke="#8fb6e8" stroke-width="2"/>
  <text x="1020" y="190" text-anchor="middle" class="box-title">Feature T-Net</text>
  <text x="1020" y="217" text-anchor="middle" class="box-text">64 × 64</text>
  <text x="1020" y="240" text-anchor="middle" class="small">Выравнивание признаков</text>

  <rect x="1190" y="150" width="250" height="100" rx="22" fill="#dcecff" stroke="#8fb6e8" stroke-width="2"/>
  <text x="1315" y="190" text-anchor="middle" class="box-title">MLP</text>
  <text x="1315" y="217" text-anchor="middle" class="box-text">64 → 128 → 1024</text>
  <text x="1315" y="240" text-anchor="middle" class="small">Глобальный дескриптор</text>

  <rect x="1190" y="340" width="250" height="100" rx="22" fill="#dff4e5" stroke="#8dc9a0" stroke-width="2"/>
  <text x="1315" y="380" text-anchor="middle" class="box-title">Global Max Pooling</text>
  <text x="1315" y="407" text-anchor="middle" class="box-text">Агрегация признаков</text>
  <text x="1315" y="430" text-anchor="middle" class="small">единый вектор облака</text>

  <rect x="760" y="560" width="320" height="110" rx="22" fill="#fff1d9" stroke="#e3b56b" stroke-width="2"/>
  <text x="920" y="603" text-anchor="middle" class="box-title">Конкатенация признаков</text>
  <text x="920" y="630" text-anchor="middle" class="box-text">Локальный контекст + глобальный вектор</text>
  <text x="920" y="653" text-anchor="middle" class="small">признаки для каждой точки</text>

  <rect x="760" y="730" width="320" height="100" rx="22" fill="#fff1d9" stroke="#e3b56b" stroke-width="2"/>
  <text x="920" y="770" text-anchor="middle" class="box-title">Point-wise MLP</text>
  <text x="920" y="797" text-anchor="middle" class="box-text">Классификация каждой точки</text>

  <rect x="1160" y="730" width="250" height="100" rx="22" fill="#ffe0de" stroke="#df8d86" stroke-width="2"/>
  <text x="1285" y="770" text-anchor="middle" class="box-title">Выход</text>
  <text x="1285" y="797" text-anchor="middle" class="box-text">N × C</text>
  <text x="1285" y="820" text-anchor="middle" class="small">класс для каждой точки</text>

  <line x1="290" y1="200" x2="350" y2="200" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="570" y1="200" x2="630" y2="200" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="850" y1="200" x2="910" y2="200" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="1130" y1="200" x2="1190" y2="200" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />

  <path d="M 1315 250 C 1315 285, 1315 305, 1315 340" fill="none" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />

  <path d="M 740 250 C 740 390, 760 470, 860 560" fill="none" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 1315 440 C 1315 500, 1195 530, 1040 560" fill="none" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />

  <line x1="920" y1="670" x2="920" y2="730" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="1080" y1="780" x2="1160" y2="780" stroke="#58728d" stroke-width="4" marker-end="url(#arrow)" />

  <rect x="70" y="790" width="520" height="70" rx="18" fill="#ffffff" stroke="#d4dde8" stroke-width="2"/>
  <circle cx="105" cy="825" r="10" fill="#dcecff" stroke="#8fb6e8" stroke-width="2"/>
  <text x="125" y="831" class="legend">Извлечение и выравнивание признаков</text>
  <circle cx="355" cy="825" r="10" fill="#dff4e5" stroke="#8dc9a0" stroke-width="2"/>
  <text x="375" y="831" class="legend">Глобальная агрегация</text>
  <circle cx="510" cy="825" r="10" fill="#fff1d9" stroke="#e3b56b" stroke-width="2"/>
  <text x="530" y="831" class="legend">Покомпонентная классификация</text>
</svg>
