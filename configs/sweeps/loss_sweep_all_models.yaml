# ─────────────────────────────────────────────────────────────────────────────
# Loss Function Sweep — все 6 моделей × 5 конфигов потерь = 30 запусков
#
# Запуск (последовательно, один за другим):
#   python scripts/run_sweep.py \
#     --config configs/sweeps/loss_sweep_all_models.yaml \
#     --output_root experiments/loss_sweep
#
# Dry-run (проверить команды без обучения):
#   python scripts/run_sweep.py \
#     --config configs/sweeps/loss_sweep_all_models.yaml \
#     --dry_run
# ─────────────────────────────────────────────────────────────────────────────

experiment_name: VKR_LossSweep
run_group: loss_sweep
dataset: Mar16
task: segmentation

# ── Общие параметры для всех моделей ───────────────────────────────────────
common_args:
  num_points: 4096
  epochs: 100
  seed: 42
  deterministic: false
  cache_dir: cache
  cache_mode: read
  cache_chunked: true
  chunk_size: 512
  num_workers: 4
  lr_scheduler: cosine
  checkpoints_root: checkpoints/loss_sweep
  early_stopping_patience: 20

# ── Модели (batch_size из результатов batch_size sweep) ────────────────────
models:
  - name: pointnet
    model: pointnet
    train_args:
      lr: 0.001
      amp: true
      batch_size: 16

  - name: pointnet++
    model: pointnet++
    train_args:
      lr: 0.0003
      batch_size: 16
      # AMP отключён: PointNet++ нестабилен с fp16 на наших данных

  - name: dgcnn
    model: dgcnn
    train_args:
      lr: 0.001
      amp: true
      k: 20
      batch_size: 4

  - name: ldgcnn_gatv2
    model: ldgcnn
    train_args:
      lr: 0.001
      amp: true
      k_small: 20
      k_large: 40
      attention_type: gatv2
      attention_k: 16
      attention_heads: 4
      attention_dropout: 0.1
      batch_size: 16

  - name: ldgcnn_localwin
    model: ldgcnn
    train_args:
      lr: 0.001
      amp: true
      k_small: 20
      k_large: 40
      attention_type: local_window
      attention_k: 16
      attention_heads: 4
      attention_dropout: 0.1
      batch_size: 16

  - name: ldgcnn_none
    model: ldgcnn
    train_args:
      lr: 0.001
      amp: true
      k_small: 20
      k_large: 40
      attention_type: none
      batch_size: 16

# ── Конфиги функций потерь ─────────────────────────────────────────────────
loss_configs:
  - name: ce_baseline
    loss_type: ce

  - name: ce_cb
    loss_type: ce
    class_balance: effective
    class_balance_beta: 0.99999

  - name: focal
    loss_type: focal
    focal_gamma: 2.0

  - name: focal_cb
    loss_type: focal
    focal_gamma: 2.0
    class_balance: effective
    class_balance_beta: 0.99999

  - name: lovasz_cb
    loss_type: lovasz
    class_balance: effective
    class_balance_beta: 0.99999
