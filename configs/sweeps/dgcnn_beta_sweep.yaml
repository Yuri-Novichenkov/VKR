experiment_name: VKR_BetaSweep
run_group: dgcnn_mar16_beta
model: dgcnn
task: segmentation
dataset: Mar16
# Ось свипа — beta параметра Class-Balanced Loss (Cui et al.):
#   w_c = (1 - beta) / (1 - beta^n_c).
# beta = 0.0   -> равные веса (эквивалент class_balance=none).
# beta -> 1.0  -> приближается к inverse frequency.
class_balance_betas: [0.0, 0.9, 0.99, 0.999, 0.9999, 0.99999]

common_args:
  epochs: 30
  num_points: 2048
  batch_size: 4   # лучший bs из new batch-свипа для dgcnn
  lr: 0.001
  amp: true
  seed: 42
  deterministic: false
  cache_dir: cache
  cache_mode: read
  cache_chunked: true
  chunk_size: 512
  num_workers: 0
  class_balance: effective
  k: 16

train_args: {}
